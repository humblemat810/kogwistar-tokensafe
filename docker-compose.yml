services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: modelguard
      POSTGRES_USER: modelguard
      POSTGRES_PASSWORD: modelguard
    ports:
      - "5432:5432"
    volumes:
      - modelguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelguard -d modelguard"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Keycloak can use the same Postgres container for a closer production shape.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/modelguard
      KC_DB_USERNAME: modelguard
      KC_DB_PASSWORD: modelguard
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/modelguard-realm.json:/opt/keycloak/data/import/modelguard-realm.json:ro

volumes:
  modelguard_pgdata:
