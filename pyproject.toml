[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kogwistar-modelkeyguard-keycloak"
version = "0.4.0"
description = "Kogwistar ACL model-key gateway with Keycloak token verification"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Kogwistar ModelKeyGuard"}]
dependencies = [
  "kogwistar>=0.2.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "cryptography>=42",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
testcontainers = ["pytest>=8", "testcontainers[postgresql]>=4.9", "psycopg[binary]>=3.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
modelkeyguard = "modelkeyguard.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["modelkeyguard*"]

[tool.setuptools.package-data]
modelkeyguard = ["web/templates/*.html", "web/static/*.js", "web/static/*.css", "web/static/vendor/*.js"]

[tool.pytest.ini_options]
addopts = "--ignore=data/postgres --ignore=postgres"
testpaths = ["tests"]
norecursedirs = [".git", ".venv", ".venv-langchain-smoke", "data", "out", "deploy"]
markers = [
  "postgres: tests that require a disposable PostgreSQL container",
]
