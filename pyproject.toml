[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kogwistar-modelkeyguard-keycloak"
version = "0.4.0"
description = "Kogwistar ACL model-key gateway with Keycloak token verification"
readme = "README.md"
requires-python = ">=3.12"

authors = [{ name = "Peter Chan", email = "humblemat@gmail.com" }]

dependencies = [
  "kogwistar>=0.2.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "cryptography>=42",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2", "psycopg2-binary>=2.9", "sqlalchemy>=2.0", "pgvector>=0.3"]
llm-cache = ["joblib>=1.4"]
testcontainers = ["pytest>=8", "testcontainers[postgresql]>=4.9", "psycopg[binary]>=3.2", "psycopg2-binary>=2.9", "sqlalchemy>=2.0", "pgvector>=0.3"]
dev = ["pytest>=8", "httpx>=0.27", "joblib>=1.4"]

[project.scripts]
modelkeyguard = "modelkeyguard.__main__:main"
modelkeyguard-token = "modelkeyguard.tools:get_agent_token_main"
modelkeyguard-usage-analysis-agent = "modelkeyguard.tools:usage_analysis_agent_main"
modelkeyguard-deploy-remote = "modelkeyguard.remote_deploy:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["modelkeyguard*"]

[tool.setuptools.package-data]
modelkeyguard = ["data/*.json", "web/templates/*.html", "web/static/*.js", "web/static/*.css", "web/static/vendor/*.js"]

[tool.pytest.ini_options]
addopts = "--ignore=data/postgres --ignore=postgres"
testpaths = ["tests"]
norecursedirs = [".git", ".venv", ".venv-langchain-smoke", "data", "out", "deploy"]
markers = [
  "postgres: tests that require a disposable PostgreSQL container",
]
