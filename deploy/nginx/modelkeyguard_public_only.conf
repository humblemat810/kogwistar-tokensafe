worker_processes auto;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  server {
    listen 8788;
    server_name _;

    # Never expose admin and schema surfaces on the public endpoint.
    location ^~ /admin/ { return 403; }
    location = /docs { return 403; }
    location = /openapi.json { return 403; }
    location = /redoc { return 403; }

    # Allow only model-serving and health surfaces for non-admin callers.
    location = /healthz { proxy_pass http://gateway:8789; }
    location = /v1/models { proxy_pass http://gateway:8789; }
    location ^~ /v1/ { proxy_pass http://gateway:8789; }
    location ^~ /openai/deployments/ { proxy_pass http://gateway:8789; }
    location ^~ /api/ { proxy_pass http://gateway:8789; }
    location ^~ /v1beta/ { proxy_pass http://gateway:8789; }

    # Default deny.
    location / { return 404; }
  }
}
