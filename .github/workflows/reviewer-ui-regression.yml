name: Reviewer and UI regression

on:
  pull_request:
    paths:
      - ".github/workflows/reviewer-ui-regression.yml"
      - "config/gateway_policy.json"
      - "modelkeyguard/reviewer_agent.py"
      - "modelkeyguard/governance_runtime.py"
      - "modelkeyguard/routers/admin_review.py"
      - "modelkeyguard/routers/admin_usage.py"
      - "modelkeyguard/services/ui_pages.py"
      - "modelkeyguard/web/**"
      - "scripts/usage_reviewer_agent.py"
      - "tests/test_reviewer_agent.py"
      - "tests/test_admin_ops_routes.py"
      - "tests/test_governance_smoke_harness.py"
  push:
    branches: ["main", "codex/**"]
    paths:
      - ".github/workflows/reviewer-ui-regression.yml"
      - "config/gateway_policy.json"
      - "modelkeyguard/reviewer_agent.py"
      - "modelkeyguard/governance_runtime.py"
      - "modelkeyguard/routers/admin_review.py"
      - "modelkeyguard/routers/admin_usage.py"
      - "modelkeyguard/services/ui_pages.py"
      - "modelkeyguard/web/**"
      - "scripts/usage_reviewer_agent.py"
      - "tests/test_reviewer_agent.py"
      - "tests/test_admin_ops_routes.py"
      - "tests/test_governance_smoke_harness.py"

permissions:
  contents: read

jobs:
  cpython:
    name: reviewer/UI (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install provider-free test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install \
            "kogwistar>=0.5.0" "pydantic>=2.6" "pydantic-extension>=0.0.7" \
            "anyio>=4.0" "Jinja2>=3.1" "mcp>=2.2.0,<3" "httpx>=0.28.1" \
            "fastapi>=0.115" "uvicorn>=0.30" "python-multipart>=0.0.9" \
            "cryptography>=42" "python-jose[cryptography]>=3.3" "PyJWT>=2.8" \
            "RapidFuzz>=3.13.0" "python-dotenv>=1.0.1" "requests>=2.32" \
            "typing-extensions>=4.8" "pytest>=8" "pytest-asyncio>=1.1" \
            "pytest-dotenv>=0.5.2" "joblib>=1.4"

      - name: Run reviewer and admin regression tests
        env:
          MODELKEYGUARD_CI_NON_CONTAINER: "1"
          KOGWISTAR_IMPL_MODE: python
        run: |
          python -m pytest -q \
            tests/test_reviewer_agent.py \
            tests/test_admin_ops_routes.py \
            tests/test_governance_smoke_harness.py

      - name: Compile backend and check browser assets
        run: |
          python -m py_compile \
            modelkeyguard/reviewer_agent.py \
            modelkeyguard/governance_runtime.py \
            modelkeyguard/routers/admin_review.py \
            modelkeyguard/routers/admin_usage.py \
            scripts/usage_reviewer_agent.py
          node --check modelkeyguard/web/static/admin_review.js
          node --check modelkeyguard/web/static/admin_history.js
          node --check modelkeyguard/web/static/admin_usage.js

  pypy:
    name: reviewer/UI (PyPy 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PyPy
        uses: actions/setup-python@v5
        with:
          python-version: pypy-3.11-v7.3.23
          cache: pip
          cache-dependency-path: requirements-pypy-3.11.txt

      - name: Checkout Kogwistar core source
        run: |
          git clone --depth 1 https://github.com/humblemat810/kogwistar.git "$RUNNER_TEMP/kogwistar-core"
          echo "PYTHONPATH=$RUNNER_TEMP/kogwistar-core:$PYTHONPATH" >> "$GITHUB_ENV"

      - name: Install PyPy provider-free dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pypy-3.11.txt

      - name: Run reviewer regression tests
        env:
          MODELKEYGUARD_CI_NON_CONTAINER: "1"
          MODELKEYGUARD_STORE: jsonl
          KOGWISTAR_IMPL_MODE: python
        run: python -m pytest -q tests/test_reviewer_agent.py

      - name: Compile backend and check browser assets
        run: |
          python -m py_compile modelkeyguard/reviewer_agent.py scripts/usage_reviewer_agent.py
          node --check modelkeyguard/web/static/admin_review.js
