name: CI (Non-Container Tests)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  non_container_pytest:
    name: pytest (${{ matrix.python-version }}, skip container-required tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies (non-container profile)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (non-container only)
        env:
          MODELKEYGUARD_CI_NON_CONTAINER: "1"
        run: |
          pytest -q -m "not postgres"

  pypy311_provider_free:
    name: pytest (PyPy 3.11, provider-free)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PyPy
        uses: actions/setup-python@v5
        with:
          python-version: "pypy-3.11-v7.3.20"
          cache: "pip"
          cache-dependency-path: requirements-pypy-3.11.txt

      - name: Install PyPy provider-free dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pypy-3.11.txt

      - name: Run PyPy provider-free tests
        env:
          MODELKEYGUARD_CI_NON_CONTAINER: "1"
          MODELKEYGUARD_STORE: "jsonl"
          KOGWISTAR_IMPL_MODE: "python"
        run: |
          pytest -q -m "not postgres" -k "not kogwistar_postgres and not live_provider_streaming"
