name: CI (Non-Container Tests)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  non_container_pytest:
    name: pytest (skip container-required tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (non-container profile)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (non-container only)
        env:
          MODELKEYGUARD_CI_NON_CONTAINER: "1"
        run: |
          pytest -q -m "not postgres"
